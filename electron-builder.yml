appId: dev.pilot.app
executableName: pilot
directories:
  output: dist
files:
  - out/**
asarUnpack:
  - node_modules/@lydell/node-pty-*/**/*
extraResources:
  - from: resources/icon.png
    to: icon.png
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  target: nsis
  icon: resources/icon.ico
  signtoolOptions:
    signingHashAlgorithms: [sha256]
nsis:
  # The installed product must keep its registry key across the app ID change.
  guid: 9a907120-d156-5094-b3fe-beb35bfd5735
  include: resources/installer.nsh
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
linux:
  icon: resources/icon.png
  category: Development
  artifactName: pilot-${version}-linux-${arch}.${ext}
  target:
    - AppImage
    - deb
deb:
  maintainer: Pilot <49786674+Murmureeee@users.noreply.github.com>
  # apt replaces the legacy package because both packages own the same app files.
  fpm: [--conflicts, pi-desktop, --replaces, pi-desktop]
