<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Pilot 应用图标源文件：终端提示符 + emerald 光标（呼应应用内品牌）
       修改后运行：node scripts/make-icons.mjs 重新生成 icon.png / icon.ico -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 终端提示符 > -->
  <path d="M136 176 L232 256 L136 336" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- emerald 光标（应用内流式光标的同款色） -->
  <rect x="272" y="306" width="116" height="36" rx="18" fill="#34d399"/>
</svg>
