name: Desktop CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      build_test_packages:
        description: Build Windows, Linux and macOS test packages for Actions
        type: boolean
        default: false
      verify_installation:
        description: Verify a clean install and HTTPS update on Windows
        type: boolean
        default: false
      prepare_release:
        description: Verify Windows and Linux packages and prepare a GitHub release draft
        type: boolean
        default: false
      include_macos_release:
        description: Include signed and notarized Apple Silicon assets when preparing a release
        type: boolean
        default: false
      verify_published_update:
        description: Install and update from the public GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      release_artifact: ${{ steps.release_assets.outputs.name }}
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      PILOT_UPDATE_TEST_URL: https://127.0.0.1:7936/releases/latest/download/
      PILOT_RELEASE_UPDATE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/
    steps:
      - name: Validate update feed selection
        if: inputs.verify_published_update && (inputs.verify_installation || inputs.prepare_release)
        run: throw 'Run published update verification separately from tests using the loopback feed.'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '11.21.0'

      - name: Install locked dependencies
        run: |
          Get-Process -Name electron -ErrorAction SilentlyContinue | Stop-Process -Force
          pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec oxlint src tests

      - name: Test
        env:
          VITEST_MAX_WORKERS: '2'
        run: pnpm exec vitest --run

      - name: Check unused code
        run: pnpm exec knip

      - name: Build
        run: pnpm build

      - name: Electron smoke test and development startup
        run: node scripts/verify-windows.mjs

      - name: Windows desktop UI scenes
        run: pnpm verify:windows:ui

      - name: Build Windows test installer
        if: inputs.build_test_packages && !inputs.prepare_release
        run: pnpm package:win

      - name: Upload Windows test installer
        if: inputs.build_test_packages && !inputs.prepare_release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pilot-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Check out the 0.1.0 installer baseline
        if: inputs.verify_installation || inputs.prepare_release || inputs.verify_published_update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ad9600ea7dd4b46bb9e6b46585a85d16062c1646
          path: .pilot-baseline
          persist-credentials: false

      - name: Build the pi Desktop compatibility installer
        if: inputs.verify_installation || inputs.prepare_release || inputs.verify_published_update
        working-directory: .pilot-baseline
        env:
          PI_UPDATE_URL: ${{ inputs.verify_published_update && env.PILOT_RELEASE_UPDATE_URL || env.PILOT_UPDATE_TEST_URL }}
        run: |
          Get-Process -Name electron -ErrorAction SilentlyContinue | Stop-Process -Force
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json
          $manifest.productName = 'pi Desktop'
          $manifest | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath 'package.json' -Encoding utf8
          pnpm package:win

      - name: Verify fresh install, signed HTTPS update and uninstall
        if: inputs.verify_installation || inputs.prepare_release
        id: candidate
        env:
          PILOT_UPDATE_URL: ${{ env.PILOT_UPDATE_TEST_URL }}
          ELECTRON_BUILDER_OFFLINE: 'true'
        run: |
          $certDir = Join-Path $env:RUNNER_TEMP ('pilot-update-tls-' + [guid]::NewGuid())
          $certificate = $null
          $signer = $null
          New-Item -Path $certDir -ItemType Directory | Out-Null
          try {
            $certificate = New-SelfSignedCertificate -Subject 'CN=Pilot update acceptance' -TextExtension '2.5.29.17={text}IPAddress=127.0.0.1' -KeyExportPolicy Exportable -NotAfter (Get-Date).AddHours(2) -CertStoreLocation 'Cert:\CurrentUser\My'
            $env:PILOT_UPDATE_TEST_CERT = Join-Path $certDir 'server.cer'
            $env:PILOT_UPDATE_TEST_PFX = Join-Path $certDir 'server.pfx'
            $env:PILOT_UPDATE_TEST_PASSPHRASE = [guid]::NewGuid().ToString()
            $password = ConvertTo-SecureString $env:PILOT_UPDATE_TEST_PASSPHRASE -AsPlainText -Force
            Export-Certificate -Cert $certificate -FilePath $env:PILOT_UPDATE_TEST_CERT | Out-Null
            Export-PfxCertificate -Cert $certificate -FilePath $env:PILOT_UPDATE_TEST_PFX -Password $password | Out-Null
            Write-Output 'Loopback HTTPS certificate prepared.'

            $signer = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Pilot installer acceptance, O=Pilot Test' -KeyExportPolicy Exportable -NotAfter (Get-Date).AddHours(2) -CertStoreLocation 'Cert:\CurrentUser\My'
            $signerCert = Join-Path $certDir 'signer.cer'
            Export-Certificate -Cert $signer -FilePath $signerCert | Out-Null
            # The disposable runner has no desktop prompt for adding a user-trusted root.
            certutil.exe -f -addstore Root $signerCert | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not trust the temporary signing certificate on the runner.' }
            Write-Output 'Temporary code-signing certificate trusted on the runner.'
            $env:WIN_CSC_LINK = Join-Path $certDir 'signer.pfx'
            $env:WIN_CSC_KEY_PASSWORD = [guid]::NewGuid().ToString()
            Write-Output "::add-mask::$env:WIN_CSC_KEY_PASSWORD"
            $signingPassword = ConvertTo-SecureString $env:WIN_CSC_KEY_PASSWORD -AsPlainText -Force
            Export-PfxCertificate -Cert $signer -FilePath $env:WIN_CSC_LINK -Password $signingPassword | Out-Null
            $env:PILOT_WINDOWS_PUBLISHER = $signer.Subject

            $version = (Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json).version
            pnpm package:win
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $installer = "dist/release/pilot-$version-x64-setup.exe"
            node scripts/verify-windows-signing.mjs $installer 'dist/release/win-unpacked'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/verify-windows-installation.mjs '.pilot-baseline/dist/release/pi-desktop-0.1.0-x64-setup.exe' $installer $version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "version=$version" >> $env:GITHUB_OUTPUT
          } finally {
            if ($signer) {
              $trustedSigner = "Cert:\LocalMachine\Root\$($signer.Thumbprint)"
              if (Test-Path -LiteralPath $trustedSigner) { Remove-Item -LiteralPath $trustedSigner }
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($signer.Thumbprint)" -DeleteKey
            }
            if ($certificate) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey }
            foreach ($file in @('server.cer', 'server.pfx', 'signer.cer', 'signer.pfx')) {
              $certFile = Join-Path $certDir $file
              if (Test-Path -LiteralPath $certFile) { Remove-Item -LiteralPath $certFile }
            }
            Remove-Item -LiteralPath $certDir
            if (Test-Path -LiteralPath $certDir) { throw 'Temporary certificate files were not removed.' }
            Write-Output 'Temporary signing and TLS materials were removed.'
          }

      - name: Verify the published Windows update over HTTPS
        if: inputs.verify_published_update
        env:
          PILOT_PUBLISHED_UPDATE_URL: ${{ env.PILOT_RELEASE_UPDATE_URL }}
        run: |
          $downloads = Join-Path $env:RUNNER_TEMP ('pilot-public-update-' + [guid]::NewGuid())
          New-Item -Path $downloads -ItemType Directory | Out-Null
          try {
            $baseUrl = $env:PILOT_PUBLISHED_UPDATE_URL
            $manifestPath = Join-Path $downloads 'latest.yml'
            Invoke-WebRequest -Uri "${baseUrl}latest.yml" -OutFile $manifestPath -TimeoutSec 30 -MaximumRetryCount 2
            $manifest = Get-Content -Raw -LiteralPath $manifestPath
            $version = [regex]::Match($manifest, '(?m)^version: (?<value>\d+\.\d+\.\d+)\r?$').Groups['value'].Value
            if (!$version) { throw 'Invalid version in the public update manifest.' }
            $installerName = [regex]::Match($manifest, '(?m)^path: (?<value>[^\r\n]+)\r?$').Groups['value'].Value
            if ($installerName -cnotin @("pilot-${version}-x64-setup.exe", "pi-desktop-${version}-x64-setup.exe")) { throw 'Unexpected installer path in the public update manifest.' }
            foreach ($asset in @($installerName, "$installerName.blockmap")) {
              $file = Join-Path $downloads $asset
              Invoke-WebRequest -Uri "$baseUrl$asset" -OutFile $file -TimeoutSec 150 -MaximumRetryCount 2
              if ((Get-Item -LiteralPath $file).Length -le 0) { throw "Empty release asset $asset" }
            }
            $installer = Join-Path $downloads $installerName
            $hash = Get-FileHash -LiteralPath $installer -Algorithm SHA512
            $base64 = [Convert]::ToBase64String([Convert]::FromHexString($hash.Hash))
            if ($manifest -notmatch ('(?m)^sha512: ' + [regex]::Escape($base64) + '\r?$')) { throw 'Public installer checksum mismatch.' }
            foreach ($file in (Get-ChildItem -LiteralPath $downloads -File)) {
              $digest = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Output "Public asset $($file.Name) SHA-256 $digest"
            }
            Write-Output "Public installer SHA-512 matches latest.yml for v$version."
            node scripts/verify-windows-installation.mjs '.pilot-baseline/dist/release/pi-desktop-0.1.0-x64-setup.exe' $installer $version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            foreach ($file in (Get-ChildItem -LiteralPath $downloads -File)) {
              Remove-Item -LiteralPath $file.FullName
            }
            Remove-Item -LiteralPath $downloads
            if (Test-Path -LiteralPath $downloads) { throw 'The public release download directory was not removed.' }
            Write-Output 'Published release downloads were removed.'
          }

      - name: Build Windows assets for GitHub Releases
        if: github.ref == 'refs/heads/main' && inputs.prepare_release
        id: release_assets
        env:
          PILOT_UPDATE_URL: ${{ env.PILOT_RELEASE_UPDATE_URL }}
          PILOT_CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          PILOT_WINDOWS_PUBLISHER: ${{ vars.PILOT_WINDOWS_PUBLISHER }}
        run: |
          pnpm package:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = Get-Content -Raw -LiteralPath 'dist/release/win-unpacked/resources/app-update.yml'
          if ($config -notmatch ('(?m)^url: ' + [regex]::Escape($env:PILOT_UPDATE_URL) + '\s*$')) { throw 'The build is missing its GitHub Releases URL.' }
          if ($env:WIN_CSC_LINK) {
            node scripts/verify-windows-signing.mjs "dist/release/pilot-${env:PILOT_CANDIDATE_VERSION}-x64-setup.exe" 'dist/release/win-unpacked'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "name=Pilot-release-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}" >> $env:GITHUB_OUTPUT

      - name: Stage installer, blockmap and update manifest
        if: github.ref == 'refs/heads/main' && inputs.prepare_release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release_assets.outputs.name }}
          path: |
            dist/release/pilot-${{ steps.candidate.outputs.version }}-x64-setup.exe
            dist/release/pilot-${{ steps.candidate.outputs.version }}-x64-setup.exe.blockmap
            dist/release/latest.yml
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  linux:
    if: inputs.build_test_packages || inputs.prepare_release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
      artifact: ${{ steps.package.outputs.artifact }}
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      PILOT_UPDATE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '11.21.0'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test on Linux
        run: pnpm exec vitest --run

      - name: Build Linux AppImage and Debian packages
        id: package
        run: |
          pnpm package:linux
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=Pilot-linux-x64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Start both Linux packages in isolated profiles
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null ||
            ! command -v dbus-run-session >/dev/null || ! command -v xdotool >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth dbus-x11 xdotool
          fi
          bash scripts/verify-linux-package.sh

      - name: Verify Linux package updates
        run: dbus-run-session -- xvfb-run -a node scripts/verify-linux-update.mjs --install-deb

      - name: Stage verified Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/pilot-${{ steps.package.outputs.version }}-linux-x86_64.AppImage
            dist/pilot-${{ steps.package.outputs.version }}-linux-amd64.deb
            dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos:
    if: inputs.build_test_packages || (inputs.prepare_release && inputs.include_macos_release)
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      version: ${{ steps.package.outputs.version }}
      artifact: ${{ steps.package.outputs.artifact }}
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      PILOT_UPDATE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '11.21.0'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test on macOS
        run: pnpm exec vitest --run

      - name: Build and verify macOS test packages
        if: '!inputs.prepare_release || !inputs.include_macos_release'
        run: |
          test "$(uname -m)" = arm64
          pnpm package:mac
          node scripts/verify-macos-package.mjs

      - name: Build, notarize and verify signed macOS release packages
        if: github.ref == 'refs/heads/main' && inputs.prepare_release && inputs.include_macos_release
        env:
          PILOT_MAC_SIGNED: 'true'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test "$(uname -m)" = arm64
          test -n "$APPLE_API_KEY_BASE64"
          export APPLE_API_KEY
          APPLE_API_KEY=$(mktemp "$RUNNER_TEMP/pilot-notary.XXXXXX")
          trap 'rm -f -- "$APPLE_API_KEY"' EXIT
          chmod 600 "$APPLE_API_KEY"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$APPLE_API_KEY"
          unset APPLE_API_KEY_BASE64
          pnpm package:mac
          node scripts/verify-macos-package.mjs

      - name: Resolve macOS artifacts
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=Pilot-macos-arm64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Stage verified Mac packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/pilot-${{ steps.package.outputs.version }}-mac-arm64.dmg
            dist/pilot-${{ steps.package.outputs.version }}-mac-arm64.zip
            dist/pilot-${{ steps.package.outputs.version }}-mac-arm64.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release-draft:
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && inputs.prepare_release &&
      needs.windows.result == 'success' && needs.linux.result == 'success' &&
      (!inputs.include_macos_release || needs.macos.result == 'success')
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.windows.outputs.release_artifact }}
          path: ${{ runner.temp }}/pilot-release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.linux.outputs.artifact }}
          path: ${{ runner.temp }}/pilot-release

      - name: Verify platform versions match
        env:
          WINDOWS_VERSION: ${{ needs.windows.outputs.version }}
          LINUX_VERSION: ${{ needs.linux.outputs.version }}
          MACOS_VERSION: ${{ needs.macos.outputs.version }}
          INCLUDE_MACOS: ${{ inputs.include_macos_release }}
        run: |
          test "$WINDOWS_VERSION" = "$LINUX_VERSION"
          if [ "$INCLUDE_MACOS" = true ]; then
            test "$WINDOWS_VERSION" = "$MACOS_VERSION"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.include_macos_release
        with:
          name: ${{ needs.macos.outputs.artifact }}
          path: ${{ runner.temp }}/pilot-release

      - name: Prepare and verify the GitHub release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_RELEASE_VERSION: ${{ needs.windows.outputs.version }}
          PILOT_RELEASE_INCLUDE_MACOS: ${{ inputs.include_macos_release }}
        run: ./scripts/draft-release.ps1
